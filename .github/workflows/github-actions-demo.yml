name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Устанавливаем зависимости
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-format \
          cppcheck \
          g++ \
          make \
          libgtest-dev \
          cmake \
          valgrind
        # Сборка Google Test
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib

    # 2. Исправляем порядок include в TextEditor.cpp
    - name: Fix include order
      run: |
        if [ -f "TextEditor.cpp" ]; then
          # Проверяем текущий порядок
          if grep -q '#include "TextEditor.h"' TextEditor.cpp && \
             grep -q '#include "pch.h"' TextEditor.cpp; then
            # Если оба include есть, исправляем порядок
            sed -i '1i#include "pch.h"' TextEditor.cpp
            sed -i '/#include "pch.h"/{n;d}' TextEditor.cpp
          fi
        fi

    # 3. Проверка стиля кода
    - name: Check Google Code Style
      run: |
        find . -name '*.cpp' -o -name '*.h' | xargs clang-format -i -style=Google
        if ! git diff --quiet; then
          echo "Code style issues found:"
          git diff
          exit 1
        fi

    # 4. Статический анализ (с учетом вашего кода)
    - name: Run Cppcheck (Linter)
      run: |
        cppcheck \
          --enable=warning,performance,portability \
          --inconclusive \
          --error-exitcode=1 \
          . \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --suppress=functionConst \
          --suppress=constVariableReference \
          --suppress=missingInclude:pch.h \
          --suppress=missingInclude:gtest/gtest.h

    # 5. Сборка и запуск тестов
    - name: Build and run tests
      run: |
        make clean
        make test
        if [ -f "build/test_runner" ]; then
          ./build/test_runner
        else
          echo "Error: test_runner not found"
          exit 1
        fi

    # 6. Сборка с санитайзерами
    - name: Build with sanitizers
      run: |
        make clean
        make sanitize
        if [ -f "build/test_runner" ]; then
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./build/test_runner
        else
          echo "Error: test_runner not found after sanitize build"
          exit 1
        fi

    # 7. Проверка утечек памяти (Valgrind)
    - name: Memory check with Valgrind
      run: |
        make clean
        make test
        if [ -f "build/test_runner" ]; then
          valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --error-exitcode=1 \
            --errors-for-leak-kinds=all \
            ./build/test_runner 2>&1 | tail -50
        else
          echo "Error: test_runner not found for valgrind"
          exit 1
        fi

    # 8. Сборка основной программы
    - name: Build main program
      run: |
        make clean
        make
        if [ -f "build/main" ]; then
          echo "Main program compiled successfully"
          # Проверяем что программа запускается
          timeout 1s ./build/main --help || true
        else
          echo "Error: main program not found"
          exit 1
        fi

    # 9. Упаковка артефактов
    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          build/
          *.cpp
          *.h
        retention-days: 7
