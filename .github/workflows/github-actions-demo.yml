name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Find and build
      run: |
        # Находим все .cpp файлы кроме тестов
        CPP_FILES=$(find . -name "*.cpp" ! -name "*Test*" ! -name "*test*" | tr '\n' ' ')
        
        if [ -z "$CPP_FILES" ]; then
          echo "Error: No .cpp files found!"
          exit 1
        fi
        
        echo "Found files: $CPP_FILES"
        g++ -std=c++11 -Wall $CPP_FILES -o main
        
    - name: Run
      run: ./main
