name: C++ CI for Banking System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Установка зависимостей
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make

    # Просто собираем обычную версию
    - name: Build Program
      run: |
        echo "Building program..."
        make clean
        make
        echo "✓ Build successful!"

    # Запуск программы
    - name: Run Program
      run: |
        echo "Running program..."
        ./main
        echo "✓ Program executed successfully!"

    # Сборка с санитайзерами (отдельно)
    - name: Build with Sanitizers
      run: |
        echo "Building with sanitizers..."
        make clean
        g++ -std=c++11 -Wall -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Source.cpp Bank.cpp -o main_sanitize
        echo "✓ Sanitizer build successful!"
        
    - name: Run Sanitized Version
      run: |
        echo "Running sanitized version..."
        ./main_sanitize 2>&1 || true
