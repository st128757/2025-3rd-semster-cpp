name: C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y g++ make libgtest-dev
        
    - name: Build and test
      run: |
        if [ -d "HW_2+GTest" ]; then
          cd "HW_2+GTest"
        fi
        
        # Создаем простой Makefile
        cat > Makefile << 'EOF'
CXX=g++
CXXFLAGS=-std=c++17 -Wall -I. -pthread -D_WIN32
GTEST=-lgtest -lgtest_main

all: test_runner text_editor

test_runner: test.o TextEditor.o
	$(CXX) $(CXXFLAGS) -o $@ $^ $(GTEST)

text_editor: main.o TextEditor.o
	$(CXX) $(CXXFLAGS) -o $@ $^

%.o: %.cpp
	$(CXX) $(CXXFLAGS) -c $< -o $@

clean:
	rm -f *.o test_runner text_editor

test: test_runner
	./test_runner

.PHONY: all clean test
EOF
        
        make clean
        make test
