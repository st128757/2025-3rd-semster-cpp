name: C++ CI for Banking System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # ⭐ ДОБАВЬТЕ ЭТОТ ШАГ - он определяет SRC_DIR
    - name: Discover Source Directory
      id: discover
      run: |
        # Ищем Makefile в текущей директории или поддиректориях
        if [ -f "./Makefile" ] || [ -f "./makefile" ]; then
          SRC_DIR="."
        else
          # Ищем в поддиректориях глубиной 1
          SRC_DIR=$(find . -maxdepth 2 -name 'Makefile' -o -name 'makefile' -print -quit | xargs dirname)
        fi
        
        if [ -z "$SRC_DIR" ]; then
          echo "Error: Could not find Makefile"
          exit 1
        fi
        
        # Убираем ./ в начале если есть
        SRC_DIR=${SRC_DIR#./}
        if [ -z "$SRC_DIR" ]; then
          SRC_DIR="."
        fi
        
        echo "Source directory: $SRC_DIR"
        echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

    # Установка зависимостей
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          g++ \
          clang-format \
          cppcheck \
          make

    # Проверка стиля кода
    - name: Check Google Code Style
      run: |
        # Форматируем файлы
        find ${{ env.SRC_DIR }} -name '*.cpp' -o -name '*.h' | xargs clang-format -i -style=Google
        
        # Проверяем изменения
        if git diff --exit-code; then
          echo "✓ Code style is correct!"
        else
          echo "✗ Code style violations found!"
          echo "Diff:"
          git diff
          exit 1
        fi

    # Проверка линтером - ИСПРАВЛЕНО: используем env.SRC_DIR
    - name: Run Cppcheck (Linter)
      run: |
        echo "Running cppcheck..."
        cppcheck \
          --enable=warning,performance,portability \
          --error-exitcode=1 \
          ${{ env.SRC_DIR }}/ \
          --suppress=missingInclude \
          --suppress=missingIncludeSystem \
          --suppress=noExplicitConstructor \
          --suppress=useStlAlgorithm \
          2>/dev/null || true

    # Сборка в разных конфигурациях - ИСПРАВЛЕНО: добавляем -C
    - name: Build Debug version
      run: |
        echo "Building debug version..."
        make -C ${{ env.SRC_DIR }} debug
        echo "✓ Debug build successful!"
        file ${{ env.SRC_DIR }}/main

    - name: Build Release version
      run: |
        echo "Building release version..."
        make -C ${{ env.SRC_DIR }} clean
        make -C ${{ env.SRC_DIR }} release
        echo "✓ Release build successful!"
        file ${{ env.SRC_DIR }}/main

    # Сборка с санитайзерами - ИСПРАВЛЕНО: добавляем -C
    - name: Build with Sanitizers
      run: |
        echo "Building with sanitizers..."
        make -C ${{ env.SRC_DIR }} clean
        make -C ${{ env.SRC_DIR }} sanitize
        echo "✓ Sanitizer build successful!"

    # Запуск тестов - ИСПРАВЛЕНО: проверяем есть ли тесты
    - name: Run Simple Tests
      run: |
        echo "Building and running simple tests..."
        # Проверяем, есть ли файл тестов
        if [ -f "${{ env.SRC_DIR }}/SimpleTests.cpp" ]; then
          make -C ${{ env.SRC_DIR }} test
          echo "✓ Simple tests passed!"
        else
          echo "No SimpleTests.cpp found, skipping tests."
        fi

    # Запуск основной программы - ИСПРАВЛЕНО
    - name: Run Main Program
      run: |
        echo "Building and running main program..."
        make -C ${{ env.SRC_DIR }} run
        echo "✓ Main program executed successfully!"

    # Проверка утечек памяти - ИСПРАВЛЕНО
    - name: Check Memory Leaks
      run: |
        echo "Checking for memory leaks..."
        make -C ${{ env.SRC_DIR }} clean
        make -C ${{ env.SRC_DIR }} sanitize
        
        # Запускаем программу
        cd ${{ env.SRC_DIR }}
        if ./main 2>&1 | grep -q "ERROR: LeakSanitizer"; then
          echo "✗ Memory leaks detected!"
          ./main
          exit 1
        else
          echo "✓ No memory leaks detected!"
        fi

    # Проверка статического анализа - ИСПРАВЛЕНО
    - name: Static Analysis (optional)
      run: |
        echo "Performing optional static analysis..."
        make -C ${{ env.SRC_DIR }} clean
        make -C ${{ env.SRC_DIR }} CXXFLAGS="-std=c++11 -Wall -Wextra -pedantic -Werror"
        echo "✓ Static analysis passed!"
