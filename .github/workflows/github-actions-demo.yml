name: C++ CI for Banking System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. ⭐ НОВЫЙ ШАГ: Динамический поиск папки
    - name: Discover Source Directory
      id: discover
      run: |
        SRC_DIR=$(find . -maxdepth 2 -name 'Makefile' -o -name 'makefile' -print -quit | xargs dirname)
        if [ -z "$SRC_DIR" ]; then
          echo "Error: Could not find 'Makefile' or 'makefile' in a sub-directory."
          exit 1
        fi
        SRC_DIR=${SRC_DIR#./}
        echo "Source directory detected: $SRC_DIR"
        echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

    # 2. Устанавливаем инструменты
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          g++ \
          clang-format \
          cppcheck \
          make

    # 3. Проверка стиля
    - name: Check Google Code Style
      run: |
        find ${{ env.SRC_DIR }} -name '*.cpp' -o -name '*.h' | xargs clang-format -i -style=Google
        git diff --exit-code

    # 4. Линтер (без фатальных ошибок для warning'ов)
    - name: Run Cppcheck
      run: |
        echo "Running cppcheck..."
        cppcheck --enable=warning,style,performance ${{ env.SRC_DIR }}/ 2>&1 || true

    # 5. Сборка основной программы
    - name: Build Main Program
      run: |
        echo "Building main program..."
        make -C ${{ env.SRC_DIR }} clean
        make -C ${{ env.SRC_DIR }}

    # 6. Сборка с санитайзерами
    - name: Build with Sanitizers
      run: |
        echo "Building with sanitizers..."
        make -C ${{ env.SRC_DIR }} clean
        make -C ${{ env.SRC_DIR }} CXX=g++ CXXFLAGS="-std=c++11 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"

    # 7. Запуск программы
    - name: Run Program
      run: |
        echo "Running program..."
        ./${{ env.SRC_DIR }}/main

    # 8. Сборка и запуск тестов (если есть файл тестов)
    - name: Build and Run Tests
      run: |
        if [ -f "${{ env.SRC_DIR }}/SimpleTests.cpp" ] || [ -f "${{ env.SRC_DIR }}/TestBank.cpp" ]; then
          echo "Building and running tests..."
          # Пробуем собрать тесты
          make -C ${{ env.SRC_DIR }} tests 2>/dev/null || echo "No 'tests' target in Makefile"
          
          # Запускаем если существует
          if [ -f "${{ env.SRC_DIR }}/tests" ]; then
            ./${{ env.SRC_DIR }}/tests
          fi
        else
          echo "No test files found, skipping tests."
        fi
