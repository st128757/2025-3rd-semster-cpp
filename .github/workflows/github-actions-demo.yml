name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 0. Переходим в директорию с файлами
    - name: Change to project directory
      run: |
        if [ -d "HW_2+GTest" ]; then
          cd "HW_2+GTest"
          echo "Перешли в HW_2+GTest/"
        fi
        echo "Текущая директория: $(pwd)"
        echo "Содержимое:"
        ls -la

    # 1. Устанавливаем зависимости
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-format \
          cppcheck \
          g++ \
          make \
          libgtest-dev \
          cmake
        # Сборка Google Test
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib

    # 3. Проверка стиля кода
    - name: Check Google Code Style
      run: |
        find . -name '*.cpp' -o -name '*.h' | xargs clang-format -i -style=Google
        if ! git diff --quiet; then
          echo "Найдены проблемы со стилем кода:"
          git diff
          exit 1
        fi

    # 4. Статический анализ
    - name: Run Cppcheck (Linter)
      run: |
        cppcheck \
          --enable=warning,performance,portability \
          --inconclusive \
          --error-exitcode=1 \
          .

    # 5. Сборка и запуск тестов
    - name: Build and run tests
      run: |
        echo "Сборка тестов..."
        make clean
        make test
        echo "Запуск тестов..."
        if [ -f "test_runner" ]; then
          ./test_runner
        elif [ -f "build/test_runner" ]; then
          ./build/test_runner
        else
          echo "Ошибка: test_runner не найден"
          echo "Ищем файлы..."
          find . -type f -name "*test*" | head -10
          exit 1
        fi

    # 6. Сборка с санитайзерами
    - name: Build with sanitizers
      run: |
        echo "Сборка с санитайзерами..."
        make clean
        make sanitize
        echo "Запуск тестов с санитайзерами..."
        if [ -f "test_runner" ]; then
          ASAN_OPTIONS=detect_leaks=1 ./test_runner
        elif [ -f "build/test_runner" ]; then
          ASAN_OPTIONS=detect_leaks=1 ./build/test_runner
        fi

    # 7. Проверка утечек памяти (Valgrind)
    - name: Memory check with Valgrind
      run: |
        echo "Проверка памяти Valgrind..."
        make clean
        make test
        if [ -f "test_runner" ]; then
          valgrind --leak-check=full --show-leak-kinds=all ./test_runner 2>&1 | tail -50
        elif [ -f "build/test_runner" ]; then
          valgrind --leak-check=full --show-leak-kinds=all ./build/test_runner 2>&1 | tail -50
        fi

    # 8. Сборка основной программы
    - name: Build main program
      run: |
        echo "Сборка основной программы..."
        make clean
        make
        if [ -f "main" ]; then
          echo "✓ Основная программа скомпилирована"
          echo "Тестовый запуск (2 секунды):"
          timeout 2s ./main || echo "Программа завершилась (ожидаемо)"
        elif [ -f "build/main" ]; then
          echo "✓ Основная программа скомпилирована в build/"
          echo "Тестовый запуск (2 секунды):"
          timeout 2s ./build/main || echo "Программа завершилась (ожидаемо)"
        else
          echo "✗ Ошибка: основная программа не найдена"
          exit 1
        fi
