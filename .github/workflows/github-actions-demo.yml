name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libgtest-dev \
          clang-format-14 \
          clang-tidy-14 \
          valgrind
        # Сборка Google Test
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib
    
    - name: Модульные тесты
      run: |
        echo "=== Сборка и запуск тестов ==="
        make test
    
    - name: Тесты с санитайзерами
      run: |
        echo "=== Тесты с AddressSanitizer и UndefinedBehaviorSanitizer ==="
        make sanitize
    
    - name: Проверка Google Code Style
      run: |
        echo "=== Проверка стиля кода ==="
        make check-style
    
    - name: Статический анализ (линтер)
      run: |
        echo "=== Статический анализ clang-tidy ==="
        make lint
    
    - name: Сборка основной программы
      run: |
        echo "=== Сборка основной программы ==="
        make build
    
    - name: Проверка на утечки памяти (Valgrind)
      run: |
        echo "=== Проверка на утечки памяти ==="
        make clean
        make test
        valgrind --leak-check=full --error-exitcode=1 ./bin/tests
