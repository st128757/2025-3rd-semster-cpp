name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Устанавливаем зависимости
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-format \
          cppcheck \
          g++ \
          make \
          libgtest-dev \
          cmake \
          valgrind
        # Сборка Google Test
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib

    # 2. Проверка стиля кода
    - name: Check Google Code Style
      run: |
        find . -name '*.cpp' -o -name '*.h' | xargs clang-format -i -style=Google
        if ! git diff --quiet; then
          echo "Найдены проблемы со стилем кода:"
          git diff
          exit 1
        fi

    # 3. Статический анализ
    - name: Run Cppcheck
      run: |
        cppcheck \
          --enable=warning,performance,portability \
          --inconclusive \
          --error-exitcode=1 \
          .

    # 4. Сборка и запуск тестов
    - name: Build and run tests
      run: |
        echo "=== Сборка тестов ==="
        make clean
        make test

    # 5. Сборка с санитайзерами
    - name: Build with sanitizers
      run: |
        echo "=== Сборка с санитайзерами ==="
        make clean
        make sanitize

    # 6. Проверка утечек памяти (Valgrind)
    - name: Memory check with Valgrind
      run: |
        echo "=== Проверка памяти Valgrind ==="
        make clean
        make test
        if [ -f "test_runner" ]; then
          valgrind --leak-check=full --show-leak-kinds=all ./test_runner 2>&1 | tail -50
        fi

    # 7. Сборка основной программы
    - name: Build main program
      run: |
        echo "=== Сборка основной программы ==="
        make clean
        make
        if [ -f "main" ]; then
          echo "✓ Основная программа скомпилирована"
        fi
