name: Build and Run

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install g++
      run: sudo apt-get update && sudo apt-get install -y g++
    
    - name: Build
      run: g++ -std=c++11 -Wall Source.cpp Bank.cpp -o main
    
    - name: Run
      run: ./main
