name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libgtest-dev cmake
        
    - name: Build Google Test
      run: |
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp lib/*.a /usr/lib
        cd -
        
    - name: Build main program (без тестов)
      run: |
        cd HW_3+GTest
        # Собираем только основные файлы без pch.h
        g++ -std=c++11 -Wall -I. main.cpp Bank.cpp -o main
        
    - name: Run program
      run: |
        cd HW_3+GTest
        ./main
